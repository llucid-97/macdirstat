[package]
name = "macdirstat"
version = "0.5.0"
edition = "2024"
default-run = "macdirstat"
description = "fast windirstat clone for macos"
license = "GPL-3.0"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui", "dep:image", "dep:libc", "dep:rayon", "dep:rfd", "dep:treemap"]
cli = ["dep:serde_json"]

[[bin]]
name = "macdirstat"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "macdirstat-cli"
path = "src/bin/macdirstat-cli.rs"
required-features = ["cli"]

[dependencies]
eframe = { version = "0.31", optional = true }
egui = { version = "0.31", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
libc = { version = "0.2", optional = true }
rayon = { version = "1", optional = true }
rfd = { version = "0.15", optional = true }
treemap = { version = "0.3", optional = true }
serde_json = { version = "1", optional = true }

